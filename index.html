<script>
function toggleMenu(){const n=document.getElementById('mobileNav');n.style.display=n.style.display==='block'?'none':'block'}
document.querySelectorAll('#mobileNav a').forEach(a=>a.addEventListener('click',()=>document.getElementById('mobileNav').style.display='none'));
function showToast(message){const t=document.getElementById('toast');t.textContent=message;t.style.display='block';clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>t.style.display='none',4500)}
document.getElementById('trackForm').addEventListener('submit',function(e){e.preventDefault();const code=document.getElementById('trackingCode').value.trim();const box=document.getElementById('trackResult');box.style.display='block';box.innerHTML='<strong>Recherche de suivi : '+escapeHTML(code)+'</strong><br>Cette maquette fonctionne côté navigateur, mais elle n’est pas connectée à une base de données de transport. Pour afficher le statut réel, connectez un service de suivi ou un serveur.';});
function escapeHTML(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
document.querySelectorAll('.tab').forEach(tab=>tab.addEventListener('click',()=>{document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));tab.classList.add('active');const labels={achat:'Achat',envoi:'Envoi colis',transport:'Transport',autre:'Autre demande'};document.getElementById('requestType').value=labels[tab.dataset.kind];}));
document.getElementById('quoteForm').addEventListener('submit',function(e){e.preventDefault();const data={type:document.getElementById('requestType').value,nom:document.getElementById('name').value,tel:document.getElementById('phone').value,email:document.getElementById('email').value,depart:document.getElementById('origin').value,destination:document.getElementById('destination').value,service:document.getElementById('service').value,poids:document.getElementById('weight').value,details:document.getElementById('details').value};const body=Object.entries(data).map(([k,v])=>k+': '+v).join('\n');const subject='Demande de devis — L’EXPRESS LOGISTIQUE';const mail='mailto:kexpresskexpress0@gmail.com?subject='+encodeURIComponent(subject)+'&body='+encodeURIComponent(body);showToast('Votre demande est prête. Votre application e-mail va s’ouvrir.');window.location.href=mail;});
